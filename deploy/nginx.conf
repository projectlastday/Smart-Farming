events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream frontend_upstream {
        server frontend:80;
    }

    upstream backend_upstream {
        server backend:8000;
    }

    map $host $agrifusion_hsts {
        default "";
        sf.projectdunia.my.id "max-age=31536000; includeSubDomains";
    }

    # Local Compose HTTP listener. Never send HSTS here.
    server {
        listen 80 default_server;
        server_name 127.0.0.1 localhost _;
        client_max_body_size 12m;
        include /etc/nginx/agrifusion-proxy-locations.conf;
    }

    # Public hostname via Cloudflare Tunnel. HSTS is host-scoped to this name only.
    server {
        listen 80;
        server_name sf.projectdunia.my.id;
        client_max_body_size 12m;
        include /etc/nginx/agrifusion-proxy-locations-public.conf;
    }
}
