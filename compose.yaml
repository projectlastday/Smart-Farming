services:
  mysql:
    image: mysql:8.4.3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agrifusionnet}
      MYSQL_USER: ${MYSQL_USER:-agrifusion}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-db}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-agrifusion}", "-p${MYSQL_PASSWORD:-change-me-db}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - internal
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-agrifusion}:${MYSQL_PASSWORD:-change-me-db}@mysql:3306/${MYSQL_DATABASE:-agrifusionnet}?charset=utf8mb4
      DISEASE_MODEL_PATH: /models/disease_v1.onnx
      SOILGRIDS_CACHE_DIR: /fixtures/soilgrids
      SOILGRIDS_LIVE_CACHE_DIR: /data/adapter-cache/soilgrids-live
      NASA_POWER_CACHE_DIR: /data/adapter-cache/nasa-power
      NASA_POWER_ENABLED: ${NASA_POWER_ENABLED:-true}
      SOILGRIDS_LIVE_ENABLED: ${SOILGRIDS_LIVE_ENABLED:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://sf.projectdunia.my.id}
    volumes:
      - ./models:/models:ro
      - ./fixtures:/fixtures:ro
      - saved_images:/data/saved_images
      - uploads_tmp:/data/uploads_tmp
      - adapter_cache:/data/adapter-cache
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks:
      - internal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: nginx:1.27.3-alpine
    ports:
      - "8005:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/agrifusion-proxy-locations.conf:/etc/nginx/agrifusion-proxy-locations.conf:ro
      - ./deploy/agrifusion-proxy-locations-public.conf:/etc/nginx/agrifusion-proxy-locations-public.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
  saved_images:
  uploads_tmp:
  adapter_cache:
